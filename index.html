<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donnat Taj Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #111827; color: white; text-align: center; padding: 20px; }
        .card { background: #1f2937; padding: 15px; border-radius: 12px; margin-top: 20px; border: 1px solid #374151; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🎮 Donnat Taj Mini App</h1>
    <div class="card">
        <p>Хуш омадед! Интихоби хизматрасониҳо ва бозиҳо дар ин ҷо кушода мешавад.</p>
        <button onclick="Telegram.WebApp.close()">Пӯшидани Mini App</button>
    </div>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
      </html>
